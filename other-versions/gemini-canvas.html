<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>명함 관리 매니저 - AI 스캔 & 업로드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; }
        .modal-open { overflow: hidden; }
        .scanning-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to bottom, transparent, #6366f1, transparent);
            box-shadow: 0 0 15px #6366f1;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .pulse-border {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { border-color: rgba(99, 102, 241, 0.3); }
            50% { border-color: rgba(99, 102, 241, 1); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 transition-colors duration-300">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <!-- 헤더 섹션 -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
            <div>
                <h1 class="text-4xl font-extrabold text-indigo-700 flex items-center gap-3">
                    <i data-lucide="contact-round" class="w-10 h-10"></i>
                    명함 매니저
                </h1>
                <p id="card-count" class="text-slate-500 mt-2 text-lg">연결 중...</p>
                <div id="user-display" class="text-[10px] text-slate-400 mt-1 font-mono uppercase tracking-tighter"></div>
            </div>

            <div class="flex flex-wrap gap-2">
                <input type="file" id="csv-upload" class="hidden" accept=".csv,text/csv" onchange="handleImportCSV(event)">
                <!-- 휴대폰 기본 카메라 앱 / 갤러리로 촬영 (권한 팝업 없이 동작) -->
                <input type="file" id="photo-upload" class="hidden" accept="image/*" capture="environment" onchange="handlePhotoFile(event)">
                <input type="file" id="gallery-upload" class="hidden" accept="image/*" onchange="handlePhotoFile(event)">

                <button onclick="document.getElementById('csv-upload').click()" class="flex items-center gap-2 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl transition-all shadow-sm font-semibold">
                    <i data-lucide="upload" class="w-4 h-4 text-indigo-600"></i>
                    데이터 업로드
                </button>
                <button onclick="downloadCSV()" class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-700 px-5 py-2.5 rounded-xl transition-all shadow-sm font-semibold">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    엑셀 저장
                </button>
                <button onclick="document.getElementById('photo-upload').click()" class="flex items-center gap-2 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 px-5 py-2.5 rounded-xl transition-all shadow-sm font-semibold">
                    <i data-lucide="image" class="w-4 h-4"></i>
                    사진으로 스캔
                </button>
                <button onclick="openCameraModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-200 font-semibold">
                    <i data-lucide="scan-line" class="w-4 h-4"></i>
                    AI 명함 스캔
                </button>
                <button onclick="openModal()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-slate-200 font-semibold">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    수동 추가
                </button>
            </div>
        </header>

        <!-- 검색 영역 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row items-center gap-4">
            <div class="relative flex-1 w-full">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                <input
                    type="text"
                    id="search-input"
                    oninput="handleSearch()"
                    placeholder="이름, 회사, 전화번호, 메모로 검색..."
                    class="w-full pl-12 pr-12 py-3.5 rounded-xl bg-slate-50 border border-transparent focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100 outline-none transition-all text-lg"
                />
                <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i data-lucide="circle-x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- 명함 목록 -->
        <div id="content-area" class="min-h-[400px]">
            <!-- Table for Desktop -->
            <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase tracking-widest">
                        <tr>
                            <th class="px-8 py-5">프로필 / 이름</th>
                            <th class="px-6 py-5">소속 정보</th>
                            <th class="px-6 py-5">연락처</th>
                            <th class="px-6 py-5">이메일</th>
                            <th class="px-8 py-5 text-right">관리</th>
                        </tr>
                    </thead>
                    <tbody id="card-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>

            <!-- Card View for Mobile -->
            <div id="card-mobile-grid" class="grid grid-cols-1 gap-4 md:hidden"></div>
        </div>
    </div>

    <!-- 추가/수정 모달 -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
                <h2 id="modal-title" class="text-2xl font-bold flex items-center gap-3 text-slate-800"></h2>
                <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-all">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form id="card-form" onsubmit="handleSubmit(event)" class="p-8 space-y-5 overflow-y-auto">
                <input type="hidden" id="card-id">

                <div id="scan-preview-container" class="hidden mb-6 relative rounded-2xl overflow-hidden border-2 border-indigo-100 shadow-inner">
                    <img id="scan-preview" class="w-full h-48 object-cover" alt="스캔한 명함">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent flex items-end p-4">
                        <span class="text-white text-sm font-bold flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-4 h-4 text-yellow-400"></i> AI가 분석한 원본 이미지
                        </span>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-500 uppercase tracking-wider ml-1">이름 *</label>
                    <input required id="form-name" class="w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all text-lg font-medium" placeholder="성함을 입력하세요">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-500 uppercase tracking-wider ml-1">회사명</label>
                        <input id="form-company" class="w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all" placeholder="에이아이 테크">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-500 uppercase tracking-wider ml-1">직함</label>
                        <input id="form-position" class="w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all" placeholder="팀장 / 매니저">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-500 uppercase tracking-wider ml-1">전화번호</label>
                    <input type="tel" inputmode="tel" id="form-phone" class="w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all" placeholder="010-0000-0000">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-500 uppercase tracking-wider ml-1">이메일</label>
                    <input type="email" inputmode="email" id="form-email" class="w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all" placeholder="example@mail.com">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-500 uppercase tracking-wider ml-1">메모</label>
                    <textarea id="form-memo" class="w-full px-5 py-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all h-28 resize-none" placeholder="미팅 장소, 인상착의 등 특이사항을 적어주세요."></textarea>
                </div>

                <div class="pt-4 flex gap-3 sticky bottom-0 bg-white pb-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl transition-all">
                        취소
                    </button>
                    <button type="submit" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition-all flex items-center justify-center gap-2 shadow-xl shadow-indigo-100">
                        <i data-lucide="check" class="w-5 h-5"></i>
                        <span id="submit-btn-text">저장하기</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 카메라 스캔 모달 -->
    <div id="camera-overlay" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-[60] p-4">
        <div class="relative w-full max-w-lg aspect-[3/2] bg-slate-900 rounded-[2.5rem] border-2 border-indigo-500/50 overflow-hidden shadow-2xl pulse-border">
            <!-- muted + playsinline: iOS Safari에서 인라인 재생에 필요 -->
            <video id="video-feed" autoplay playsinline muted class="w-full h-full object-cover"></video>

            <div id="scanning-line" class="scanning-line hidden"></div>

            <div class="absolute inset-10 border-2 border-dashed border-white/40 rounded-2xl pointer-events-none flex items-center justify-center">
                <div class="text-white/20 text-[10px] font-bold uppercase tracking-[0.3em]">Business Card Frame</div>
            </div>
        </div>

        <div class="mt-12 flex items-center gap-12">
            <button onclick="closeCameraModal()" class="w-16 h-16 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all group" aria-label="닫기">
                <i data-lucide="chevron-left" class="w-8 h-8 group-hover:-translate-x-1 transition-transform"></i>
            </button>
            <button id="capture-btn" onclick="captureAndAnalyze()" class="relative group" aria-label="촬영">
                <div class="absolute -inset-6 bg-indigo-500/20 rounded-full blur-2xl group-hover:bg-indigo-500/40 transition-all animate-pulse"></div>
                <div class="relative w-24 h-24 rounded-full bg-white border-[10px] border-slate-900 hover:scale-105 active:scale-95 transition-all flex items-center justify-center">
                    <div class="w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center text-white">
                        <i data-lucide="camera" class="w-7 h-7"></i>
                    </div>
                </div>
            </button>
            <button onclick="pickFromGallery()" class="w-16 h-16 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all" aria-label="갤러리에서 선택">
                <i data-lucide="image" class="w-7 h-7"></i>
            </button>
        </div>

        <div class="mt-8 text-center">
            <p class="text-white font-medium text-lg">명함을 가이드라인에 맞춰주세요</p>
            <p class="text-white/40 text-sm mt-2 px-10">밝은 곳에서 정면으로 촬영하면 인식률이 향상됩니다.</p>
        </div>
    </div>

    <!-- AI 분석 중 오버레이 (카메라/사진 공통) -->
    <div id="analyze-overlay" class="hidden fixed inset-0 bg-black/80 flex flex-col items-center justify-center text-white gap-6 backdrop-blur-md z-[80]">
        <div class="relative">
            <div class="w-20 h-20 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i data-lucide="brain" class="w-8 h-8 text-indigo-400 animate-pulse"></i>
            </div>
        </div>
        <div class="text-center">
            <p class="text-xl font-bold tracking-tight">AI 엔진 분석 중...</p>
            <p class="text-slate-400 text-sm mt-2">텍스트와 연락처 정보를 추출하고 있습니다.</p>
        </div>
    </div>

    <!-- 카메라 사용 불가 안내 모달 -->
    <div id="camera-help-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[70]">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="camera-off" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800">카메라를 열 수 없습니다</h3>
            <p id="camera-help-reason" class="text-slate-500 mt-2 text-sm"></p>
            <p class="text-slate-500 mt-3 text-sm">대신 휴대폰 기본 카메라로 촬영하거나<br>저장된 사진을 선택할 수 있습니다.</p>
            <div class="flex flex-col gap-2 mt-6">
                <button onclick="closeCameraHelp(); document.getElementById('photo-upload').click()" class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                    <i data-lucide="camera" class="w-4 h-4"></i> 기본 카메라로 촬영
                </button>
                <button onclick="closeCameraHelp(); document.getElementById('gallery-upload').click()" class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl flex items-center justify-center gap-2">
                    <i data-lucide="image" class="w-4 h-4"></i> 갤러리에서 선택
                </button>
                <button onclick="closeCameraHelp()" class="py-2 text-slate-400 text-sm">닫기</button>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[70]">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="triangle-alert" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800">연락처 삭제</h3>
            <p class="text-slate-500 mt-2">정말 이 연락처를 삭제하시겠습니까?<br>이 작업은 되돌릴 수 없습니다.</p>
            <div class="flex gap-3 mt-8">
                <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">취소</button>
                <button id="confirm-delete-btn" class="flex-1 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg shadow-rose-100">삭제하기</button>
            </div>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 flex flex-col gap-2 z-[100]"></div>

    <canvas id="capture-canvas" class="hidden"></canvas>

    <script type="module">
        // =====================================================================
        // 설정
        // ---------------------------------------------------------------------
        // Gemini Canvas 안에서 실행하면 __firebase_config / API 키가 자동 주입됩니다.
        // 직접 배포(HTTPS 호스팅)할 때만 아래 값을 채우세요.
        //  - FIREBASE_CONFIG를 비워두면 데이터는 이 기기(localStorage)에만 저장됩니다.
        //  - GEMINI_API_KEY는 Google AI Studio에서 발급받은 키를 넣습니다.
        // =====================================================================
        const FIREBASE_CONFIG = null; // 예: { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }
        const GEMINI_API_KEY = "";
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const LOCAL_KEY = 'bizcard-manager-cards';

        let cards = [];
        let searchTerm = '';
        let stream = null;
        let deleteTargetId = null;
        let currentUser = null;
        let storageMode = 'local'; // 'cloud' | 'local'
        let fb = null;             // Firestore 함수 모음 (클라우드 모드일 때만)

        const $ = (id) => document.getElementById(id);
        const refreshIcons = () => window.lucide && lucide.createIcons();

        // ---------------------------------------------------------------------
        // 유틸
        // ---------------------------------------------------------------------
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function telHref(phone) {
            return String(phone || '').replace(/[^\d+]/g, '');
        }

        function newId() {
            return (crypto.randomUUID && crypto.randomUUID()) || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        function showToast(message, type = 'success') {
            const container = $('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'circle-check' : type === 'info' ? 'info' : 'circle-alert';
            const bgColor = type === 'success' ? 'bg-slate-800' : type === 'info' ? 'bg-indigo-600' : 'bg-rose-600';

            toast.className = `${bgColor} text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 min-w-[300px] max-w-[90vw] transition-opacity duration-300`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i> <span class="font-medium">${esc(message)}</span>`;
            container.appendChild(toast);
            refreshIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ---------------------------------------------------------------------
        // 저장소: Firebase가 가능하면 클라우드, 아니면 이 기기(localStorage)
        // ---------------------------------------------------------------------
        function loadLocal() {
            try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; }
            catch { return []; }
        }

        function saveLocal() {
            try { localStorage.setItem(LOCAL_KEY, JSON.stringify(cards)); }
            catch { showToast("이 기기에 저장하지 못했습니다.", "error"); }
        }

        async function initCloud() {
            const hasInjected = typeof __firebase_config !== 'undefined' && __firebase_config;
            if (!hasInjected && !FIREBASE_CONFIG) return false;

            try {
                const config = hasInjected ? JSON.parse(__firebase_config) : FIREBASE_CONFIG;
                const [{ initializeApp }, authMod, fsMod] = await Promise.all([
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
                ]);

                const app = initializeApp(config);
                const auth = authMod.getAuth(app);
                const db = fsMod.getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await authMod.signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await authMod.signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                if (!currentUser) return false;

                fb = { db, ...fsMod };
                return true;
            } catch (e) {
                console.error("Firebase 초기화 실패, 로컬 저장으로 전환:", e);
                return false;
            }
        }

        function cardsCollection() {
            return fb.collection(fb.db, 'artifacts', appId, 'users', currentUser.uid, 'cards');
        }

        function cardDoc(id) {
            return fb.doc(fb.db, 'artifacts', appId, 'users', currentUser.uid, 'cards', id);
        }

        function startCloudSync() {
            fb.onSnapshot(cardsCollection(), (snapshot) => {
                cards = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                render();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast("데이터 연결에 실패했습니다.", "error");
            });
        }

        async function saveCard(cardData, id = null) {
            try {
                if (storageMode === 'cloud') {
                    if (id) await fb.updateDoc(cardDoc(id), cardData);

                    render();
                }
                return true;
            } catch (e) {
                console.error(e);
                showToast("저장에 실패했습니다.", "error");
                return false;
            }
        }

        // 카메라 (getUserMedia) + 실패 시 휴대폰 기본 카메라로 대체
        // ---------------------------------------------------------------------
        function cameraErrorReason(err) {
            const reasons = {
                NotAllowedError: "카메라 권한이 거부되었습니다. 브라우저/앱 설정에서 카메라를 허용하거나, 앱이 iframe 안에서 실행 중이라 차단되었을 수 있습니다.",
                SecurityError: "보안 정책(iframe 권한 등)으로 카메라가 차단되었습니다.",
                NotFoundError: "사용 가능한 카메라가 없습니다.",
                NotReadableError: "다른 앱이 카메라를 사용 중입니다. 다른 앱을 종료한 뒤 다시 시도하세요.",
                OverconstrainedError: "요청한 카메라 설정을 지원하지 않습니다.",
                AbortError: "카메라를 여는 중 중단되었습니다."
            };
            return reasons[err?.name] || `알 수 없는 카메라 오류 (${err?.name || err})`;
        }

        function showCameraHelp(reason) {
            $('camera-help-reason').innerText = reason;

        window.closeCameraHelp = function() {

        async function requestCameraStream() {
            try {
                return await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
            } catch (err) {
                // 일부 기기는 세부 조건을 지원하지 않으므로 기본값으로 한 번 더 시도
                if (err.name === 'OverconstrainedError' || err.name === 'NotFoundError') {
                    return await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
                }
                throw err;
            }
        }

                showCameraHelp("HTTPS 주소(또는 localhost)에서만 실시간 카메라를 사용할 수 있습니다.");
                return;

            try {

        // 이미지를 최대 1600px JPEG로 줄여 전송량을 낮춤 (휴대폰 데이터/속도 고려)
        function toJpegBase64(source, srcWidth, srcHeight, maxSide = 1600) {
            const scale = Math.min(1, maxSide / Math.max(srcWidth, srcHeight));
            const canvas = $('capture-canvas');
            canvas.width = Math.round(srcWidth * scale);
            canvas.height = Math.round(srcHeight * scale);
            canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        }

            const base64Image = toJpegBase64(video, video.videoWidth, video.videoHeight);

            await analyzeImage(base64Image);

        }

            } catch (err) {
                console.error(err);

            } finally {

        async function callGeminiVision(base64Image) {
            const prompt = "Extract contact details from this business card. Return a JSON object with: name, company, position, phone, email, memo. Use empty string for missing fields. Keep Korean text as-is.";
            const payload = {
                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Image } }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            company: { type: "STRING" },
                            position: { type: "STRING" },
                            phone: { type: "STRING" },
                            email: { type: "STRING" },
                            memo: { type: "STRING" }
                        }
                    }
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
            const retries = [1000, 2000, 4000];

            for (let i = 0; i <= retries.length; i++) {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => null);

                if (response?.ok) {
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw Object.assign(new Error('Empty response'), { userMessage: "명함 내용을 인식하지 못했습니다." });
                    return JSON.parse(text);
                }

                // 키/요청 오류(4xx, 429 제외)는 재시도해도 소용없음
                if (response && response.status >= 400 && response.status < 500 && response.status !== 429) {
                    const hint = (response.status === 400 || response.status === 403)
                        ? "Gemini API 키를 확인하세요. (Canvas 밖에서는 GEMINI_API_KEY 입력 필요)"
                        : `AI 요청 오류 (${response.status})`;
                    throw Object.assign(new Error(`HTTP ${response.status}`), { userMessage: hint });
                }

                if (i === retries.length) {
                    throw Object.assign(new Error('Network/Server error'), { userMessage: "네트워크 또는 AI 서버 오류입니다. 잠시 후 다시 시도하세요." });
                }
                await new Promise(r => setTimeout(r, retries[i]));
            }
        }

        // ---------------------------------------------------------------------
        // 휴대폰 연락처 연동: 전화 / 문자 / 메일 / 연락처 저장(vCard)
        // ---------------------------------------------------------------------
        function vcardEscape(value) {
            return String(value || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
        }

        function makeVCard(c) {
            const lines = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `FN:${vcardEscape(c.name)}`,
                `N:${vcardEscape(c.name)};;;;`
            ];
            if (c.company) lines.push(`ORG:${vcardEscape(c.company)}`);
            if (c.position) lines.push(`TITLE:${vcardEscape(c.position)}`);
            if (c.phone) lines.push(`TEL;TYPE=CELL:${vcardEscape(c.phone)}`);
            if (c.email) lines.push(`EMAIL;TYPE=INTERNET:${vcardEscape(c.email)}`);
            if (c.memo) lines.push(`NOTE:${vcardEscape(c.memo)}`);
            lines.push('END:VCARD');
            return lines.join('\r\n');
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // 휴대폰에서는 공유 시트(연락처 앱으로 바로 열기), 그 외에는 .vcf 다운로드
        window.saveToPhoneContacts = async function(id) {
            const c = cards.find(card => card.id === id);
            if (!c) return;
            const filename = `${(c.name || 'contact').replace(/[\\/:*?"<>|]/g, '_')}.vcf`;
            const blob = new Blob([makeVCard(c)], { type: 'text/vcard;charset=utf-8' });

            try {
                const file = new File([blob], filename, { type: 'text/vcard' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: c.name });
                    return;
                }
            } catch (e) {
                if (e.name === 'AbortError') return; // 사용자가 공유 취소
            }

            downloadBlob(blob, filename);
            showToast("연락처 파일(.vcf)을 저장했습니다. 파일을 열어 연락처에 추가하세요.", "info");
        }

        // ---------------------------------------------------------------------
        // CSV 가져오기 / 내보내기
        // ---------------------------------------------------------------------
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuotes = false;
            text = text.replace(/^\uFEFF/, '');
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
                    else if (ch === '"') inQuotes = false;
                    else field += ch;
                } else if (ch === '"') inQuotes = true;
                else if (ch === ',') { row.push(field); field = ''; }
                else if (ch === '\n' || ch === '\r') {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(field); rows.push(row); row = []; field = '';
                } else field += ch;
            }
            if (field || row.length) { row.push(field); rows.push(row); }
            return rows.filter(r => r.some(v => v.trim()));
        }

        window.handleImportCSV = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = parseCSV(e.target.result);
                let added = 0;
                for (let i = 1; i < rows.length; i++) {
                    const [name = '', company = '', position = '', phone = '', email = '', memo = ''] = rows[i].map(v => v.trim());
                    if (!name) continue;
                    if (await saveCard({ name, company, position, phone, email, memo, createdAt: Date.now() })) added++;
                }
                showToast(`${added}건의 연락처를 추가했습니다.`);
                event.target.value = '';
            };
            reader.readAsText(file, 'utf-8');
        }

        window.downloadCSV = function() {
            if (cards.length === 0) return showToast("내보낼 데이터가 없습니다.", "error");
            const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            const headers = ['이름', '회사', '직함', '연락처', '이메일', '메모'];
            const rows = cards.map(c => [c.name, c.company, c.position, c.phone, c.email, c.memo].map(q).join(','));
            const content = '\uFEFF' + headers.join(',') + '\r\n' + rows.join('\r\n');
            downloadBlob(new Blob([content], { type: 'text/csv;charset=utf-8;' }), `Contacts_${new Date().toISOString().slice(0, 10)}.csv`);
            showToast("엑셀 저장 완료");

                            <div class="min-w-0"><h3 class="font-bold text-slate-900 text-lg truncate">${esc(c.name)}</h3><p class="text-slate-500 text-sm truncate">${esc(c.company) || '소속 없음'}${c.position ? ' · ' + esc(c.position) : ''}</p></div>
                        </div>
                        <button onclick="openModal('${esc(c.id)}')" class="p-2 text-slate-400 hover:text-indigo-600 bg-slate-50 rounded-lg" title="수정"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    </div>
                    <div class="space-y-2 mb-4 text-slate-600 text-sm">
                        <div class="flex items-center gap-3"><i data-lucide="phone" class="w-4 h-4 text-indigo-400"></i> ${c.phone ? `<a href="tel:${telHref(c.phone)}" class="text-indigo-600 font-semibold">${esc(c.phone)}</a>` : '-'}</div>
                        <div class="flex items-center gap-3"><i data-lucide="mail" class="w-4 h-4 text-indigo-400"></i> ${c.email ? `<a href="mailto:${esc(c.email)}" class="break-all">${esc(c.email)}</a>` : '-'}</div>
                    </div>
                    <div class="flex items-center justify-between border-t border-slate-100 pt-3 mb-3">${phoneActions(c, 'w-5 h-5')}</div>
                    <button onclick="deleteCard('${esc(c.id)}')" class="w-full py-2.5 text-rose-500 font-bold text-sm bg-rose-50 rounded-xl flex items-center justify-center gap-2"><i data-lucide="trash-2" class="w-4 h-4"></i> 삭제</button>
                </div>
            `).join('');

            refreshIcons();
        }

        // 모듈 스크립트는 지연 실행되므로 window.onload 대신 즉시 초기화
        init();
    </script>
</body>
</html>
